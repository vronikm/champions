; Configuracion de PHP para el hosting (PHP por CGI/FastCGI/LSAPI, que lee
; este archivo; el Apache con mod_php de desarrollo lo ignora).
;
; Segunda barrera: ds_core/inc/errores.php ya oculta los errores al publico,
; pero si algo falla antes de cargarlo, el error saldria en pantalla con las
; rutas del servidor. Paso el 2026-10-21 con un config/app.php sobrescrito.
; El .htaccess de la raiz impide descargar este archivo.
display_errors = Off
display_startup_errors = Off
log_errors = On
